<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SQL Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-primary text-white p-3">
                    <h4 class="mb-0">AI SQL Assistant</h4>
                    <small>Ask your database questions using natural language</small>
                </div>

                <div class="card-body p-4">

                    <form id="questionForm">
                        <label for="question" class="form-label">
                            Enter your question
                        </label>

                        <textarea
                            id="question"
                            class="form-control"
                            rows="3"
                            placeholder="Which account has the highest total debit?"
                            required></textarea>

                        <button type="submit"
                                id="submitBtn"
                                class="btn btn-primary mt-3">
                            Ask SQL Agent
                        </button>
                    </form>

                    <div id="loading" class="mt-3 d-none">
                        <div class="spinner-border spinner-border-sm text-primary"></div>
                        Processing your question...
                    </div>

                  <div id="resultContainer" class="mt-4 d-none">
                <h5>Agent Response</h5>

                <div id="answer"
         class="alert border-0 text-white"
         style="background-color: #630020; font-size: 25px; white-space: pre-wrap;">
    </div>
</div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
